<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Eid Surprise</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    overflow:hidden;
    background:black;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
}

/* INTRO */

#intro{
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
}

#intro h1{
    color:#ff2e2e;
    font-size:34px;
    letter-spacing:2px;
    text-shadow:0 0 20px red;
    animation:flicker 1.5s infinite;
}

#intro p{
    margin-top:15px;
    color:#888;
    font-size:17px;
}

@keyframes flicker{
    0%{opacity:1;}
    50%{opacity:0.4;}
    100%{opacity:1;}
}

/* MAIN */

#mainContent{
    display:none;
    flex-direction:column;
    align-items:center;
}

/* MOON */

.moon{
    position:absolute;
    top:20px;
    right:25px;
    font-size:65px;
    animation:float 3s infinite ease-in-out;
}

@keyframes float{
    50%{
        transform:translateY(-10px);
    }
}

/* STARS */

.star{
    position:absolute;
    color:white;
    opacity:0.7;
    animation:twinkle 2s infinite;
}

@keyframes twinkle{
    50%{
        opacity:0.2;
    }
}

/* GIFT */

#gift{
    font-size:120px;
    cursor:pointer;
    animation:bounce 1s infinite alternate;
    filter:drop-shadow(0 0 20px gold);
    transition:0.4s;
}

@keyframes bounce{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-15px);
    }
}

/* SUSPENSE TEXT */

#beforeText{
    margin-top:20px;
    font-size:20px;
    color:#ddd;
    max-width:500px;
    line-height:30px;
}

#tap{
    margin-top:20px;
    color:gold;
    font-size:18px;
    animation:flicker 1.2s infinite;
}

/* CARD */

#card{
    display:none;
    width:90%;
    max-width:650px;

    padding:35px;
    border-radius:20px;

    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter:blur(12px);

    box-shadow:0 0 40px rgba(255,255,255,0.08);

    animation:reveal 0.8s ease;
}

@keyframes reveal{

    0%{
        transform:scale(0.7);
        opacity:0;
    }

    100%{
        transform:scale(1);
        opacity:1;
    }
}

#card h1{
    color:gold;
    font-size:40px;
    margin-bottom:10px;
}

#card h2{
    color:#ffffff;
    font-size:30px;
    margin-bottom:25px;
    letter-spacing:2px;
}

/* TYPING */

#typing{
    font-size:22px;
    line-height:38px;
    min-height:160px;
    color:#ddd;
}

/* BUTTON */

#secretBtn{
    margin-top:25px;

    padding:14px 30px;

    border:none;
    border-radius:12px;

    background:gold;
    color:black;

    font-size:17px;
    font-weight:bold;

    cursor:pointer;

    transition:0.3s;
}

#secretBtn:hover{
    transform:scale(1.08);
    box-shadow:0 0 20px gold;
}

/* FINAL */

#final{
    display:none;

    margin-top:30px;

    font-size:24px;

    color:#ffb6ff;

    line-height:38px;

    animation:finalGlow 2s infinite alternate;
}

@keyframes finalGlow{

    from{
        text-shadow:0 0 10px #ffb6ff;
    }

    to{
        text-shadow:0 0 30px white;
    }
}

</style>
</head>

<body>

<!-- INTRO -->

<div id="intro">

    <h1>
        ACCESSING PRIVATE MESSAGE...
    </h1>

    <p>
        Authorized access detected...
    </p>

</div>

<!-- MAIN -->

<div id="mainContent">

    <!-- moon -->
    <div class="moon">🌙</div>

    <!-- stars -->
    <div class="star" style="top:10%; left:15%;">✨</div>
    <div class="star" style="top:25%; left:80%;">✦</div>
    <div class="star" style="top:60%; left:20%;">✨</div>
    <div class="star" style="top:75%; left:70%;">✦</div>

    <!-- gift -->
    <div id="gift" onclick="openGift()">
        🎁
    </div>

    <!-- suspense text -->
    <div id="beforeText">
        Jawad… someone left a hidden Eid surprise for you 🎁
    </div>

    <div id="tap">
        Tap carefully... the surprise will unlock only once 👀
    </div>

    <!-- card -->

    <div id="card">

        <h1>
            🌙 Eid-ul-Adha Mubarak 🌙
        </h1>

        <h2>
            Jawad...
        </h2>

        <p id="typing"></p>

        <button id="secretBtn" onclick="finalSurprise()">
            Reveal The Final Message
        </button>

        <div id="final">
            Not every surprise is loud… some are hidden quietly inside small moments 🌙
        </div>

    </div>

</div>

<script>

/* INTRO DELAY */

setTimeout(function(){

    document.getElementById("intro").style.display="none";

    document.getElementById("mainContent").style.display="flex";

},3000);

/* OPEN GIFT */

function openGift(){

    document.getElementById("gift").style.transform="scale(0)";
    document.getElementById("gift").style.opacity="0";

    document.getElementById("beforeText").style.display="none";
    document.getElementById("tap").style.display="none";

    setTimeout(()=>{

        document.getElementById("card").style.display="block";

        typeEffect();

    },400);
}

/* TYPING EFFECT */

let text="Maybe this Eid is just another day for everyone else... but someone wanted to make your smile a little more special tonight ✨";

let i=0;

function typeEffect(){

    if(i < text.length){

        document.getElementById("typing").innerHTML += text.charAt(i);

        i++;

        setTimeout(typeEffect,45);
    }
}

/* FINAL */

function finalSurprise(){

    document.getElementById("final").style.display="block";

    alert("🌙 Final message unlocked...");
}

</script>

</body>
</html>
