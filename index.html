<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Eid Surprise</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* 🌑 CINEMATIC BACKGROUND */
body{
    height:100vh;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    text-align:center;
    color:white;
    background:black;
}

/* 🌑 INTRO */
#intro{
    position:absolute;
    width:100%;
    height:100%;
    background:black;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:10;
}

#intro h1{
    font-size:32px;
    color:#ff3b3b;
    text-shadow:0 0 15px red;
    animation: blink 1.2s infinite;
}

#intro p{
    margin-top:15px;
    font-size:18px;
    color:#aaa;
}

@keyframes blink{50%{opacity:0.5;}}

/* 🌙 MAIN */
#mainContent{display:none;}

.moon{
    position:absolute;
    top:20px;
    right:20px;
    font-size:60px;
    animation: float 3s infinite ease-in-out;
}

@keyframes float{
    50%{transform:translateY(-10px);}
}

/* 🎁 GIFT */
#gift{
    font-size:120px;
    cursor:pointer;
    animation:bounce 1s infinite alternate;
    filter:drop-shadow(0 0 18px gold);
}

@keyframes bounce{
    from{transform:translateY(0);}
    to{transform:translateY(-15px);}
}

/* 💬 TAP TEXT */
#tap{
    margin-top:15px;
    font-size:20px;
    color:gold;
    animation: blink 1.5s infinite;
}

/* 💎 CARD */
#card{
    display:none;
    width:90%;
    max-width:600px;
    padding:30px;
    border-radius:18px;

    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 0 25px rgba(0,0,0,0.8);
    animation: pop 0.8s ease;
}

@keyframes pop{
    from{transform:scale(0.8);opacity:0;}
    to{transform:scale(1);opacity:1;}
}

#card h1{
    color:gold;
    font-size:38px;
}

#card h2{
    color:#8cff8c;
    margin-top:10px;
    font-size:24px;
}

/* ✍️ typing */
#typing{
    margin-top:20px;
    font-size:18px;
    min-height:80px;
    line-height:26px;
}

/* 🔘 BUTTON */
#secretBtn{
    margin-top:20px;
    padding:12px 25px;
    border:none;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    background:gold;
    transition:0.3s;
}

#secretBtn:hover{
    transform:scale(1.08);
}

/* 💖 FINAL */
#final{
    display:none;
    margin-top:20px;
    font-size:20px;
    color:#ffb6ff;
    animation: glow 1.5s infinite alternate;
}

@keyframes glow{
    from{text-shadow:0 0 10px pink;}
    to{text-shadow:0 0 25px white;}
}

</style>
</head>

<body>

<!-- 🌑 INTRO -->
<div id="intro">
    <h1>ACCESSING SECRET MESSAGE...</h1>
    <p>A hidden Eid surprise is waiting for someone special 🎁</p>
</div>

<!-- 🌙 MAIN -->
<div id="mainContent">

<div class="moon">🌙</div>

<!-- 🎁 GIFT -->
<div id="gift" onclick="openGift()">🎁</div>

<h2 id="tap">Please smile 😊 & tap to unlock the surprise ✨</h2>

<!-- 💎 CARD -->
<div id="card">

    <h1>🌙 Eid Mubarak 🌙</h1>
    <h2>Dear Jawad 🤍</h2>

    <p id="typing"></p>

    <button id="secretBtn" onclick="finalSurprise()">
        Unlock Final Surprise 🎉
    </button>

    <div id="final">
        A small Eid moment from Hafsa… hope it made you smile 🌙✨
    </div>

</div>

</div>

<script>

setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("mainContent").style.display="flex";
},3000);

function openGift(){
    document.getElementById("gift").style.display="none";
    document.getElementById("tap").style.display="none";
    document.getElementById("card").style.display="block";
    typeEffect();
}

let text="On this special Eid, may your life be filled with peace, success, and endless quiet happiness ✨";
let i=0;

function typeEffect(){
    if(i<text.length){
        document.getElementById("typing").innerHTML+=text[i];
        i++;
        setTimeout(typeEffect,45);
    }
}

function finalSurprise(){
    document.getElementById("final").style.display="block";
    alert("🎉 Surprise Unlocked 💖");
}

</script>

</body>
</html>
